<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Generate QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        #qrcode {
            padding: 20px;
            background: white;
        }
    </style>
</head>

<body>
    <div id="qrcode"></div>
    <script>
        // TARGET URL: This is the URL the user must use when deploying
        const targetUrl = "https://crumbs-and-co-menu.netlify.app";

        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 512,
            height: 512,
            colorDark: "#E85D04", // Crumbs & Co. Orange
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>

</html>
