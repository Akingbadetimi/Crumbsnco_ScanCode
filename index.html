<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gourmet Spot - Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <img src="image.png" alt="Crumbs & Co." class="logo">
            <p class="tagline">Café and Confectionery</p>
        </div>
    </header>

    <nav class="category-nav">
        <div class="container">
            <ul id="category-list">
                <!-- Categories will be injected here by JavaScript -->
            </ul>
        </div>
    </nav>

    <main class="menu-container">
        <div class="container" id="menu-content">
            <!-- Menu items will be injected here by JavaScript -->
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Crumbsnco. All rights reserved.</p>
            <!-- <div id="qrcode-container">
           
            </div> -->
        </div>
    </footer>

    <script src="menu_data.js"></script>
    <script src="script.js"></script>
</body>

</html>
